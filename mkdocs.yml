site_name: Selfbrowse docs
site_description: Documentation for Selfbrowse, an open-source Python browser agent.
site_url: https://rinshadkk.github.io/selfbrowse/docs/
repo_url: https://github.com/rinshadkk/selfbrowse
repo_name: rinshadkk/selfbrowse
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: _site/docs
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Atkinson Hyperlegible
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow
extra_css: [assets/extra.css]
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Get started: getting-started.md
  - Features: features.md
  - Use:
      - Command line reference: cli.md
      - What the agent can do: tools.md
      - Models: models.md
      - MCP server: mcp.md
      - CAPTCHAs and hand-off: captcha-handoff.md
      - Pop-ups and permissions: popups-permissions.md
  - Safety and privacy:
      - Guardrails: guardrails.md
      - Personal data: personal-data.md
      - Passwords and secrets: secrets.md
  - Observe:
      - Traces, prompts and screenshots: observability.md
  - Project:
      - Tests and benchmarks: benchmarks.md
