<!doctype html><title>Flight search</title>
<body style="font-family:sans-serif">
<h1>Find a fare</h1>
<input id="from" placeholder="From" />
<input id="to" placeholder="To" />
<input type="password" id="pw" placeholder="Password" />
<button onclick="location.href='flow_results.html?from='+encodeURIComponent(from.value)+'&to='+encodeURIComponent(to.value)+'&pw='+encodeURIComponent(pw.value.length)">Search</button>
</body>
