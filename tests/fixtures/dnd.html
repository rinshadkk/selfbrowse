<!doctype html><html><head><meta charset="utf-8"><title>Board</title>
<style>.col{display:inline-block;vertical-align:top;width:200px;min-height:140px;border:2px dashed #888;margin:10px;padding:8px}
.card{background:#cde;padding:8px;margin:6px 0;cursor:grab}</style></head><body>
<h1>Board</h1>
<div class="col" id="todo"><b>To do</b>
  <div class="card" draggable="true" id="c1">Write tests</div>
  <div class="card" draggable="true" id="c2">Ship it</div>
</div>
<div class="col" id="done"><b>Done</b></div>
<p id="log">nothing moved</p>
<script>
let dragged = null;
document.querySelectorAll('.card').forEach(c => c.addEventListener('dragstart', e => { dragged = c; e.dataTransfer.setData('text/plain', c.id); }));
document.querySelectorAll('.col').forEach(col => {
  col.addEventListener('dragover', e => e.preventDefault());
  col.addEventListener('drop', e => { e.preventDefault(); if (dragged) { col.appendChild(dragged); document.getElementById('log').textContent = dragged.textContent + ' -> ' + col.id; } });
});
</script></body></html>
