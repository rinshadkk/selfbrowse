[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfbrowse"
dynamic = ["version"]
description = "An open-source browser agent: low token cost, guardrails built in, plug-and-play observability."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Selfbrowse contributors" }]
keywords = ["browser", "agent", "llm", "automation", "playwright", "web-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Typing :: Typed",
]
dependencies = [
  "playwright>=1.45",
  "anthropic>=0.40",
  "openai>=1.30",
]

[project.optional-dependencies]
stealth = ["patchright>=1.50"]   # drop-in Playwright fork that hides common automation fingerprints
bench   = ["tiktoken>=0.7"]
otel    = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]      # token counting for benchmarks/
dev     = ["pytest>=8", "tiktoken>=0.7", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
selfbrowse = "selfbrowse.cli:main"

[tool.hatch.version]
path = "src/selfbrowse/__init__.py"

[project.urls]
Repository = "https://github.com/rinshadkk/selfbrowse"
Issues = "https://github.com/rinshadkk/selfbrowse/issues"
Roadmap = "https://github.com/rinshadkk/selfbrowse/blob/main/ROADMAP.md"

[tool.hatch.build.targets.wheel]
packages = ["src/selfbrowse"]

[tool.hatch.build.targets.sdist]
include = ["/src/selfbrowse", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a real Chromium/Chrome (skipped when none can be launched)"]
